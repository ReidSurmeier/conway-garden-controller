# Conservation: hardware watchdog auto-reboots the Pi if the kernel hangs.
# BCM2712 has a built-in watchdog. systemd kicks it every RuntimeWatchdogSec/2.
# Reboot watchdog (15s) ensures even a reboot-stuck system recovers.
#
# Install path: /etc/systemd/system.conf.d/10-watchdog.conf
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min

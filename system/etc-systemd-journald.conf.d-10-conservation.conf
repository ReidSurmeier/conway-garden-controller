# Conservation: keep boots persistent (so we can post-mortem after a power
# event), but cap total disk usage so the SD card never fills.
#
# Install path: /etc/systemd/journald.conf.d/10-conservation.conf
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=300M
SystemKeepFree=500M
SystemMaxFileSize=50M
MaxRetentionSec=6month
ForwardToSyslog=no

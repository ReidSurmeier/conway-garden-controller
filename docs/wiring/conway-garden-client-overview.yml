metadata:
  title: Conway Garden Control Box - Client WireViz Source
  revision: 0.4
  date: 2026-07-08
  authors:
    Created:
      name: Codex
      date: 2026-07-08
  notes: >
    Simplified WireViz source for the printable client wiring package. The
    rendered WireViz HTML, SVG, PNG, PDF, and BOM are the client-facing wiring
    artifacts. This source shows the current hardware contract: 120 V AC
    three-prong input, a single ground terminal block, two separate 5 V power
    supplies, a relay that switches only the LED-panel supply, separate START
    and STOP buttons, MSD300-1 to NV3210 video/data flow, six LED matrix
    panels, an Adafruit AHT20 enclosure sensor, and three
    temperature-controlled enclosure fans.

options:
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: "#F8FAFC"
  bgcolor_cable: "#FFFFFF"
  color_mode: SHORT
  fontname: DejaVu Sans
  mini_bom_mode: false

tweak:
  override:
    graph:
      ranksep: "0.85"
      nodesep: "0.18"

connectors:
  AC_IN:
    type: 120 V AC in
    subtype: 3-prong cable
    pinlabels: [LINE, NEUTRAL, GROUND]
    image:
      src: assets/wireviz-images/fuse_inlet.png
      height: 30

  POWER_INLET:
    type: Fuse inlet
    subtype: breaker
    pinlabels: [L_IN, N_IN, L_PI, N_PI, L_RELAY, N_LED]
    image:
      src: assets/wireviz-images/fuse_inlet.png
      height: 30
    loops:
      - [1, 3]
      - [2, 4]
      - [1, 5]
      - [2, 6]

  GROUND_TERMINAL:
    type: Ground block
    subtype: case bonded
    pinlabels: [G_IN, G_PI, G_LED]
    loops:
      - [1, 2]
      - [1, 3]
    image:
      src: assets/wireviz-images/ground_terminal.png
      height: 30

  PSU_PI:
    type: MEAN WELL LRS-50-5
    subtype: always-on 5 V
    pinlabels: [L, N, PE, +5V, GND]
    image:
      src: assets/wireviz-images/lrs50.png
      height: 30

  RELAY:
    type: LCLCTC SSR
    subtype: LED PSU line switch
    pinlabels: [L_IN, L_OUT, CTRL, GND]
    image:
      src: assets/wireviz-images/relay.png
      height: 30

  PSU_LED:
    type: MEAN WELL LRS-150F-5
    subtype: switched LED 5 V
    pinlabels:
      - L
      - N
      - PE
      - P1_5V
      - P1_GND
      - P2_5V
      - P2_GND
      - P3_5V
      - P3_GND
      - P4_5V
      - P4_GND
      - P5_5V
      - P5_GND
      - P6_5V
      - P6_GND
    image:
      src: assets/wireviz-images/lrs150.png
      height: 30

  FUSE_BOX:
    type: Blue Sea 5025
    subtype: fused 5 V branches
    pinlabels:
      - 5V_IN
      - GND
      - X1201_5V
      - X1201_G
      - MSD_5V
      - MSD_G
      - NV_5V
      - NV_G
      - F1_5V
      - F1_G
      - F2_5V
      - F2_G
      - F3_5V
      - F3_G
    loops:
      - [1, 3]
      - [2, 4]
      - [1, 5]
      - [2, 6]
      - [1, 7]
      - [2, 8]
      - [1, 9]
      - [2, 10]
      - [1, 11]
      - [2, 12]
      - [1, 13]
      - [2, 14]
    image:
      src: assets/wireviz-images/blue_sea.png
      height: 30

  X1201:
    type: Geekworm X1201
    subtype: UPS HAT
    pinlabels: [5V, GND, PI_5V, PI_GND, PLD, BATT]
    image:
      src: assets/wireviz-images/x1201.png
      height: 30

  BATTERIES:
    type: Samsung 30Q cells
    subtype: 2x 18650
    pinlabels: [PAIR]
    image:
      src: assets/wireviz-images/battery.png
      height: 30

  RPI:
    type: Raspberry Pi 5
    subtype: controller
    pinlabels: [5V, GND, PLD, START, START_GND, STOP, STOP_GND, RELAY, CTRL_GND, HDMI, AHT_3V3, AHT_GND, SDA, SCL, FAN_EN, FAN_GND]
    image:
      src: assets/wireviz-images/pi5.png
      height: 30

  START_BTN:
    type: APIELE push button
    subtype: START
    pinlabels: [SIGNAL, GND]
    image:
      src: assets/wireviz-images/push_buttons.png
      height: 30

  STOP_BTN:
    type: APIELE push button
    subtype: STOP
    pinlabels: [SIGNAL, GND]
    image:
      src: assets/wireviz-images/push_buttons.png
      height: 30

  AHT20_SENSOR:
    type: Adafruit AHT20
    subtype: I2C enclosure sensor
    pinlabels: [VIN, GND, SDA, SCL]
    image:
      src: assets/wireviz-images/aht20.png
      height: 30

  MSD300:
    type: NovaStar MSD300-1
    subtype: sender
    pinlabels: [DVI, 5V, GND, ETH]
    image:
      src: assets/wireviz-images/msd300.png
      height: 30

  NV3210:
    type: NovaStar NV3210
    subtype: receiver
    pinlabels: [ETH, 5V, GND, R1, R2, R3, R4, R5, R6]
    image:
      src: assets/wireviz-images/nv3210.png
      height: 30

  PANEL_1:
    type: LED panel
    subtype: 1 of 6
    pinlabels: [5V, GND, RIBBON]
    image:
      src: assets/wireviz-images/led_matrix_panel.png
      height: 30

  PANEL_2:
    type: LED panel
    subtype: 2 of 6
    pinlabels: [5V, GND, RIBBON]
    image:
      src: assets/wireviz-images/led_matrix_panel.png
      height: 30

  PANEL_3:
    type: LED panel
    subtype: 3 of 6
    pinlabels: [5V, GND, RIBBON]
    image:
      src: assets/wireviz-images/led_matrix_panel.png
      height: 30

  PANEL_4:
    type: LED panel
    subtype: 4 of 6
    pinlabels: [5V, GND, RIBBON]
    image:
      src: assets/wireviz-images/led_matrix_panel.png
      height: 30

  PANEL_5:
    type: LED panel
    subtype: 5 of 6
    pinlabels: [5V, GND, RIBBON]
    image:
      src: assets/wireviz-images/led_matrix_panel.png
      height: 30

  PANEL_6:
    type: LED panel
    subtype: 6 of 6
    pinlabels: [5V, GND, RIBBON]
    image:
      src: assets/wireviz-images/led_matrix_panel.png
      height: 30

  FAN_1:
    type: 30 mm fan
    subtype: 1 of 3
    pinlabels: [5V, GND, CTRL]
    image:
      src: assets/wireviz-images/fan.png
      height: 30

  FAN_2:
    type: 30 mm fan
    subtype: 2 of 3
    pinlabels: [5V, GND, CTRL]
    image:
      src: assets/wireviz-images/fan.png
      height: 30

  FAN_3:
    type: 30 mm fan
    subtype: 3 of 3
    pinlabels: [5V, GND, CTRL]
    image:
      src: assets/wireviz-images/fan.png
      height: 30

cables:
  AC_LINE_NEUTRAL:
    type: AC L/N
    show_name: false
    wirecount: 2
    colors: [BN, BU]
    wirelabels: [L, N]

  AC_GROUND:
    type: PE ground
    show_name: false
    wirecount: 1
    colors: [GNYE]
    wirelabels: [PE]

  AC_TO_PI_PSU:
    type: AC to Pi PSU
    show_name: false
    wirecount: 2
    colors: [BN, BU]
    wirelabels: [L, N]

  GROUND_TO_PI_PSU:
    type: PE to Pi PSU
    show_name: false
    wirecount: 1
    colors: [GNYE]
    wirelabels: [PE]

  AC_TO_RELAY:
    type: AC to relay
    show_name: false
    wirecount: 1
    colors: [BN]
    wirelabels: [L]

  RELAY_TO_LED_PSU:
    type: switched line
    show_name: false
    wirecount: 1
    colors: [BN]
    wirelabels: [L_SW]

  NEUTRAL_TO_LED_PSU:
    type: LED PSU neutral
    show_name: false
    wirecount: 1
    colors: [BU]
    wirelabels: [N]

  GROUND_TO_LED_PSU:
    type: PE to LED PSU
    show_name: false
    wirecount: 1
    colors: [GNYE]
    wirelabels: [PE]

  PI_PSU_TO_FUSE_BOX:
    type: controller 5 V feed
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  FUSE_BOX_TO_X1201:
    type: fused Pi 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  X1201_TO_PI:
    type: Pi power + PLD
    show_name: false
    wirecount: 3
    colors: [RD, BK, YE]
    wirelabels: [+5V, GND, PLD]

  BATTERY_LINK:
    type: battery link
    show_name: false
    wirecount: 1
    colors: [PK]
    wirelabels: [BATT]

  START_BUTTON_HARNESS:
    type: START harness
    show_name: false
    wirecount: 2
    colors: [GN, BK]
    wirelabels: [SIG, GND]

  STOP_BUTTON_HARNESS:
    type: STOP harness
    show_name: false
    wirecount: 2
    colors: [WH, BK]
    wirelabels: [SIG, GND]

  RELAY_CONTROL:
    type: relay control
    show_name: false
    wirecount: 2
    colors: [YE, BK]
    wirelabels: [CTRL, GND]

  AHT20_I2C:
    type: AHT20 I2C
    show_name: false
    wirecount: 4
    colors: [RD, BK, GN, YE]
    wirelabels: [3V3, GND, SDA, SCL]

  FUSE_BOX_TO_MSD300:
    type: fused MSD300 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  FUSE_BOX_TO_NV3210:
    type: fused NV3210 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  FUSE_BOX_TO_FAN_1:
    type: fan 1 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  FUSE_BOX_TO_FAN_2:
    type: fan 2 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  FUSE_BOX_TO_FAN_3:
    type: fan 3 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  FAN_CONTROL_HARNESS:
    type: fan GPIO control
    show_name: false
    wirecount: 2
    colors: [YE, BK]
    wirelabels: [EN, GND]

  LED_PSU_TO_PANEL_1:
    type: panel 1 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  LED_PSU_TO_PANEL_2:
    type: panel 2 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  LED_PSU_TO_PANEL_3:
    type: panel 3 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  LED_PSU_TO_PANEL_4:
    type: panel 4 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  LED_PSU_TO_PANEL_5:
    type: panel 5 5 V
    show_name: false
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [+5V, GND]

  LED_PSU_TO_PANEL_6:

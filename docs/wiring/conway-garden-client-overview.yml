    colors: [RD, BK]
    wirelabels: [+5V, GND]

  HDMI_TO_DVI:
    type: HDMI to DVI
    wirecount: 1
    colors: [BK]
    wirelabels: [video]
    shield: true
    image:
      src: assets/wireviz-images/video_adapter.png
      height: 30

  MSD300_TO_NV3210:
    type: Ethernet cable
    wirecount: 1
    colors: [BU]
    wirelabels: [novastar_data]
    notes: One complete cable; pairs not broken out.
    image:
      src: assets/wireviz-images/ethernet.png
      height: 30

  RIBBON_TO_PANEL_1:
    type: ribbon 1
    show_name: false
    wirecount: 1
    colors: [GY]
    wirelabels: [data]

  RIBBON_TO_PANEL_2:
    type: ribbon 2
    show_name: false
    wirecount: 1
    colors: [GY]
    wirelabels: [data]

  RIBBON_TO_PANEL_3:
    type: ribbon 3
    show_name: false
    wirecount: 1
    colors: [GY]
    wirelabels: [data]

  RIBBON_TO_PANEL_4:
    type: ribbon 4
    show_name: false
    wirecount: 1
    colors: [GY]
    wirelabels: [data]

  RIBBON_TO_PANEL_5:
    type: ribbon 5
    show_name: false
    wirecount: 1
    colors: [GY]
    wirelabels: [data]

  RIBBON_TO_PANEL_6:
    type: ribbon 6
    show_name: false
    wirecount: 1
    colors: [GY]
    wirelabels: [data]

